# nginx reverse proxy for ZenScail (beta.zenscail.com -> app container on :3003).
# Runs on the HOST (not in docker-compose). Install:
#   sudo cp docker/nginx/beta.zenscail.com.conf /etc/nginx/sites-available/beta.zenscail.com
#   sudo ln -s /etc/nginx/sites-available/beta.zenscail.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d beta.zenscail.com   # provisions TLS + rewrites this file
#
# certbot will add the `listen 443 ssl` block and certificate lines automatically,
# and add a redirect from :80 to :443. Until then this serves plain HTTP on :80.

server {
    listen 80;
    listen [::]:80;
    server_name beta.zenscail.com;

    # Allow large attachments / pasted content through the proxy.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;

        # Forwarded headers — Better Auth / Next rely on these to know the
        # real external scheme + host (must match BETTER_AUTH_URL).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / SSE upgrade support.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Required so streamed AI responses (chat) flush to the client instead
        # of being buffered by nginx. See Next.js self-hosting guide.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
